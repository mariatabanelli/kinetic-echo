<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1800" height="760" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g fill="none" stroke="#111" stroke-width="2">
    <rect x="60"   y="280" width="220" height="150"/>
    <rect x="440"  y="280" width="300" height="150"/>
    <rect x="900"  y="280" width="280" height="150"/>
    <rect x="1380" y="120" width="340" height="140"/>
    <rect x="1380" y="450" width="340" height="140"/>
  </g>

  <!-- titles -->
  <g fill="#111" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="1">
    <text x="170"  y="320">1 · BODY</text>
    <text x="590"  y="320">2 · PUCK</text>
    <text x="1040" y="320">3 · BRIDGE</text>
    <text x="1550" y="160">4 · ABLETON LIVE</text>
    <text x="1550" y="490">5 · TOUCHDESIGNER</text>
  </g>

  <!-- body text -->
  <g fill="#333" font-size="14" text-anchor="middle">
    <text x="170" y="355">arm, movement</text>
    <text x="170" y="378">MPU6050 on the sleeve</text>

    <text x="590" y="350">RP2350-Zero computes</text>
    <text x="590" y="372">six qualities:</text>
    <text x="590" y="396">flow · burst · tension</text>
    <text x="590" y="416">rhythm · drift · recovery</text>

    <text x="1040" y="355">Python</text>
    <text x="1040" y="378">parses the values</text>
    <text x="1040" y="401">maps to MIDI and OSC</text>

    <text x="1550" y="195">six control changes</text>
    <text x="1550" y="218">+ burst note</text>
    <text x="1550" y="241">movement becomes sound</text>

    <text x="1550" y="525">live visual</text>
    <text x="1550" y="548">six channels drive the field</text>
    <text x="1550" y="571">movement becomes image</text>
  </g>

  <!-- main arrows -->
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="280" y1="355" x2="438" y2="355"/>
    <line x1="740" y1="355" x2="898" y2="355"/>
    <line x1="1180" y1="340" x2="1378" y2="200"/>
    <line x1="1180" y1="370" x2="1378" y2="510"/>
  </g>
  <g fill="#555" font-size="12" text-anchor="middle" letter-spacing="1">
    <text x="359" y="340">IMU · I2C</text>
    <text x="819" y="340">USB SERIAL · 115200</text>
    <text x="1255" y="248">VIRTUAL MIDI</text>
    <text x="1255" y="470">OSC · UDP 7000</text>
  </g>

  <!-- three short arrows out of the puck, downward -->
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="500" y1="430" x2="500" y2="500"/>
    <line x1="590" y1="430" x2="590" y2="500"/>
    <line x1="680" y1="430" x2="680" y2="500"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle" letter-spacing="1">
    <text x="500" y="525">DISPLAY</text>
    <text x="500" y="543">character field</text>
    <text x="590" y="525">TONE</text>
    <text x="590" y="543">piezo</text>
    <text x="680" y="525">VIBRATION</text>
    <text x="680" y="543">motor</text>
  </g>

  <!-- caption -->
  <line x1="60" y1="640" x2="1720" y2="640" stroke="#ccc" stroke-width="1"/>
  <text x="900" y="690" fill="#111" font-size="16" text-anchor="middle" letter-spacing="1">THE SAME SIX VALUES LIGHT THE SCREEN, SHAPE THE SOUND AND DRIVE THE VISUAL</text>
</svg>
